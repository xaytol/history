<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f4">
  <meta name="description" content="Четыре варианта теста по истории России. 119 исходных вопросов и ответов, случайный порядок карточек и сохранение прогресса.">
  <title>History Lab — карточки по истории России</title>
  <link rel="stylesheet" href="styles.css?v=20261117-clean">
  <script src="app.js?v=20261117-clean" defer></script>
</head>
<body data-theme="light">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="History Lab">
        <span class="brand-mark">H<span>·</span></span>
        <span class="brand-copy"><strong>HISTORY LAB</strong><small>ИСТОРИЯ РОССИИ</small></span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Тёмная тема">☾</button>
    </header>

    <main>
      <section class="variant-panel" aria-label="Выбор варианта">
        <div class="variant-panel-heading">
          <div class="eyebrow">ВАРИАНТ</div>
          <span id="variant-summary">29 карточек · 0 из 29 выучено</span>
        </div>
        <div class="variant-picker" id="variant-picker">
          <button class="variant-option active" type="button"><strong>1</strong><span>29</span></button>
          <button class="variant-option" type="button"><strong>2</strong><span>30</span></button>
          <button class="variant-option" type="button"><strong>3</strong><span>30</span></button>
          <button class="variant-option" type="button"><strong>4</strong><span>30</span></button>
        </div>
      </section>

      <section class="overall-progress" aria-label="Общий прогресс">
        <div class="progress-copy">
          <span>Выучено <strong id="stat-known">0</strong> из <strong id="stat-total">119</strong></span>
          <strong id="stat-percent">0%</strong>
        </div>
        <div class="progress-track"><span id="progress-fill"></span></div>
      </section>

      <nav class="tabs" aria-label="Разделы">
        <button class="tab active" data-view="cards">Карточки</button>
        <button class="tab" data-view="trainer">Самопроверка</button>
        <button class="tab" data-view="library">Все вопросы</button>
      </nav>

      <section class="view active" id="view-cards" aria-label="Карточки">
        <div class="deck-topline">
          <span id="deck-category">ВАРИАНТ 1</span>
          <span class="deck-count"><strong id="card-number">01</strong><span> / </span><span id="deck-total">29</span></span>
          <button class="text-button" id="shuffle-btn" type="button" title="Перемешать вопросы">Перемешать ↻</button>
        </div>

        <div class="flashcard" id="flashcard" role="group" tabindex="0" aria-label="Карточка вопроса. Нажми на карточку, чтобы открыть ответ." aria-keyshortcuts="Space Enter">
          <div class="card-top">
            <span class="card-label" id="card-label">ВОПРОС 1</span>
            <span class="card-mark" aria-hidden="true">H.</span>
          </div>
          <div class="card-question" id="card-question">Загрузка вопросов…</div>
          <div class="card-answer" id="card-answer" hidden>
            <span class="answer-label">ОТВЕТ</span>
            <p id="answer-text"></p>
          </div>
          <div class="card-action">
            <button class="button button-reveal" id="flip-btn" type="button">Показать ответ</button>
          </div>
        </div>

        <div class="deck-controls">
          <button class="circle-button" id="prev-btn" type="button" aria-label="Предыдущая карточка">←</button>
          <button class="circle-button" id="next-btn" type="button" aria-label="Следующая карточка">→</button>
        </div>

        <div class="rating-row">
          <button class="rating rating-again" id="again-btn" type="button"><span class="rating-symbol">↻</span><strong>Повторить</strong></button>
          <button class="rating rating-known" id="known-btn" type="button"><span class="rating-symbol">✓</span><strong>Знаю</strong></button>
          <button class="rating rating-bookmark" id="bookmark-btn" type="button"><span class="rating-symbol" id="bookmark-symbol">☆</span><strong id="bookmark-label">В избранное</strong></button>
        </div>
      </section>

      <section class="view" id="view-trainer" aria-label="Самопроверка">
        <div class="trainer-panel">
          <div class="trainer-head">
            <span id="trainer-index">1 / 29</span>
            <span id="trainer-category">ВАРИАНТ 1</span>
          </div>
          <h2 id="trainer-question">Загрузка вопроса…</h2>
          <textarea id="my-answer" rows="4" aria-label="Твой ответ" placeholder="Твой ответ…"></textarea>
          <div class="trainer-actions">
            <button class="button button-reveal" id="trainer-reveal" type="button">Показать ответ</button>
            <button class="button button-secondary" id="trainer-skip" type="button">Пропустить</button>
          </div>
          <div class="trainer-answer" id="trainer-answer" hidden>
            <span class="answer-label">ОТВЕТ</span>
            <p id="trainer-answer-text"></p>
            <div class="trainer-grade">
              <button class="grade-button grade-no" id="trainer-no" type="button">Повторить</button>
              <button class="grade-button grade-yes" id="trainer-yes" type="button">Знаю</button>
            </div>
          </div>
        </div>
      </section>

      <section class="view" id="view-library" aria-label="Все вопросы">
        <div class="library-heading">
          <input id="search-input" type="search" placeholder="Поиск по вопросам и ответам…" aria-label="Поиск по вопросам и ответам">
          <select id="status-filter" aria-label="Фильтр по статусу">
            <option value="all">Все вопросы</option>
            <option value="new">Не повторял</option>
            <option value="known">Знаю</option>
            <option value="review">Повторить</option>
            <option value="favorites">Избранное</option>
          </select>
          <button class="text-button" id="toggle-all-answers" type="button">Показать все ответы</button>
        </div>
        <div class="results-line"><span id="library-count">29 вопросов</span></div>
        <div class="question-list" id="question-list"></div>
        <button class="button button-secondary load-more" id="load-more" type="button">Показать ещё</button>
      </section>

      <footer class="footer">
        <span>HISTORY LAB</span>
        <button id="reset-progress" class="reset-button" type="button">Сбросить прогресс</button>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Для работы тренажёра включи JavaScript в браузере.</div></noscript>
</body>
</html>
